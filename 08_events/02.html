<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>chai or code</h1>
    <button id="stop">stop</button>
</body>
<script>
    let saypushpa = function(){
     console.log('pushpendra');
     
    }
    const changeme = setTimeout(saypushpa,2000)  // ye ek time k baad function execute karta h 
    //clearTimeout(changeme)  // ye set timeout ko hatane k kaam aata h 
    document.querySelector('#stop')
    addEventListener('cliclk',function() {
        clearTimeout(changeme)
        console.log('stopped');
        
    })
    document.querySelector('h1').innerHTML = "hey world"
</script>
</html>
